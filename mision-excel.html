<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión Excel: Rescate de la información financiera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF2EF; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#0F2540; --ink2:#4B5B6C; --line:#D3DDE5;
  --green:#1D6F42; --green2:#21A366; --greenTint:#E2F2E9; --onGreen:#FFFFFF;
  --navy:#0F2540; --navy2:#173559;
  --amber:#8A5700; --amberTint:#FFF3D6; --amberLine:#E6BE66;
  --red:#B3261E; --redTint:#FDECEA; --sheetHead:#E8EEF2;
  --shadow:0 1px 2px rgba(15,37,64,.06),0 10px 28px rgba(15,37,64,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1522; --surface:#12233A; --surface2:#0F1D31; --ink:#E8EEF5; --ink2:#9FB0C3; --line:#28405C;
    --green:#3DBE7F; --green2:#4ED28F; --greenTint:#123A2A; --onGreen:#06210F;
    --navy:#08101B; --navy2:#0F2540;
    --amber:#F2C061; --amberTint:#3A2C0E; --amberLine:#7A5A1A;
    --red:#FF8A80; --redTint:#3D1917; --sheetHead:#1A2E47;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1522; --surface:#12233A; --surface2:#0F1D31; --ink:#E8EEF5; --ink2:#9FB0C3; --line:#28405C;
  --green:#3DBE7F; --green2:#4ED28F; --greenTint:#123A2A; --onGreen:#06210F;
  --navy:#08101B; --navy2:#0F2540;
  --amber:#F2C061; --amberTint:#3A2C0E; --amberLine:#7A5A1A;
  --red:#FF8A80; --redTint:#3D1917; --sheetHead:#1A2E47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:40}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--green2);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
code,.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:#fff}
.top-in{max-width:1080px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;color:#fff;font:700 14px/1 'IBM Plex Sans',sans-serif;letter-spacing:.07em;cursor:pointer;padding:6px 4px}
.brand .lg{width:28px;height:28px;border-radius:7px;background:var(--green2);display:grid;place-items:center;color:#06210F}
.stats{display:flex;align-items:center;gap:6px}
.stat{background:rgba(255,255,255,.09);border-radius:8px;padding:4px 10px;min-width:54px}
.stat small{display:block;font-size:10px;color:#AEC0D4;line-height:1.2}
.stat b{display:block;font-size:15px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat.bump{animation:bump .6s ease}
.ic-btn{background:none;border:0;color:#AEC0D4;padding:8px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.ic-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
.top-bar{height:3px;background:rgba(255,255,255,.12)}
.top-bar i{display:block;height:100%;width:0;background:var(--green2);transition:width .9s cubic-bezier(.2,.8,.2,1)}
@media (max-width:520px){.brand .b1{display:none}.stat{min-width:46px;padding:4px 8px}}

/* ---------- layout ---------- */
main{display:block}
main.enter{animation:enter .35s ease both}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 56px}
.narrow{max-width:760px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.col{min-width:0;display:grid;gap:14px}
@media (min-width:861px){.col.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.h1{font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.15;font-weight:700;letter-spacing:-.015em}
.lead2{color:var(--ink2);margin:8px 0 18px;max-width:60ch}
.cap{font-size:13px;color:var(--ink2)}

/* ---------- buttons ---------- */
.btn{appearance:none;border:0;background:var(--green);color:var(--onGreen);font:700 14px/1 'IBM Plex Sans',sans-serif;letter-spacing:.04em;padding:14px 22px;min-height:46px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);letter-spacing:0;font-weight:600}
.btn.ghost:hover{border-color:var(--green);filter:none}
.btn.big{padding:18px 30px;font-size:16px;box-shadow:0 8px 22px rgba(29,111,66,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.amber{background:var(--amberTint);color:var(--amber);border:1.5px solid var(--amberLine);letter-spacing:0;font-weight:600}

/* ---------- welcome ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-top:34px}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px;padding-top:18px}}
.mega{font-size:clamp(2.6rem,9vw,4.6rem);line-height:.98;font-weight:700;letter-spacing:-.03em;color:var(--navy)}
:root[data-theme="dark"] .mega{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mega{color:var(--ink)}}
.mega span{color:var(--green)}
.sub{font-size:clamp(1.15rem,3vw,1.5rem);font-weight:500;color:var(--green);margin:10px 0 18px}
.lead{color:var(--ink2);max-width:52ch;margin-bottom:10px}
.diff{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 24px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500}
.meter{display:inline-flex;gap:3px}.meter i{width:14px;height:7px;border-radius:2px;background:var(--line)}.meter i.on{background:var(--green2)}
.hint{font-size:13px;color:var(--ink2);margin-top:12px}
.hv{position:relative;padding:0 0 30px}
.hv .agent{position:absolute;right:-6px;bottom:-4px;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);animation:float 5s ease-in-out infinite}
.hv .agent .avatar{width:48px;height:48px}
.hv .agent b{display:block;font-size:13px}.hv .agent small{font-size:11px;color:#AEC0D4}
.hv .kpi{position:absolute;left:-8px;bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);width:150px}
.hv .kpi small{font-size:11px;color:var(--ink2);display:block}
.bars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:6px}
.bars i{flex:1;background:var(--green2);border-radius:3px 3px 0 0;animation:grow 1s ease both}
.bars i:nth-child(2){background:var(--navy2);animation-delay:.1s}.bars i:nth-child(3){animation-delay:.2s}.bars i:nth-child(4){background:var(--navy2);animation-delay:.3s}
@media (max-width:520px){.hv .kpi{display:none}.hv .agent{right:0}}
.avatar{display:block;border-radius:50%}

/* ---------- spreadsheet ---------- */
.xl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.xl-title{background:var(--green);color:var(--onGreen);padding:8px 12px;display:flex;gap:9px;align-items:center;font:600 13px 'IBM Plex Sans',sans-serif}
.xl-fx{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--surface2);font:13px 'IBM Plex Mono',monospace;min-height:34px}
.xl-name{width:62px;padding:7px 8px;border-right:1px solid var(--line);font-weight:600;text-align:center;flex:none}
.xl-f{padding:7px 10px 0;color:var(--green);font-style:italic;font-weight:600;flex:none}
.xl-v{padding:7px 8px;overflow-x:auto;white-space:nowrap;flex:1;color:var(--ink)}
.xl-scroll{overflow-x:auto}
table.xl-grid{border-collapse:collapse;width:100%;min-width:320px;font-size:14px}
.xl-grid th,.xl-grid td{border:1px solid var(--line);padding:7px 10px;white-space:nowrap;text-align:left}
.xl-grid .xl-corner,.xl-grid .xl-col,.xl-grid .xl-rn{background:var(--sheetHead);color:var(--ink2);font:500 12px 'IBM Plex Sans',sans-serif;text-align:center;padding:5px 8px}
.xl-grid .xl-rn{width:34px;padding:7px 4px}
.xl-grid .xl-col{cursor:pointer;user-select:none}
.xl-grid .xl-col:hover{background:var(--greenTint);color:var(--green)}
.xl-grid td{cursor:cell;background:var(--surface)}
.xl-grid td.h{background:var(--greenTint);font-weight:700;color:var(--green);cursor:default}
.xl-grid td.n{text-align:right;font-variant-numeric:tabular-nums}
.xl-grid td.err{background:var(--redTint);color:var(--red);font-weight:600}
.xl-grid td.okc{background:var(--greenTint);color:var(--green);font-weight:700}
.xl-grid td.pend{background:var(--amberTint);color:var(--amber);font-style:italic}
.xl-grid td.wrapc{white-space:normal;word-break:break-word;min-width:130px}
.xl-grid td.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
.xl-grid td.cs{outline:2px solid var(--green2);outline-offset:-2px}
.xl-grid tr.hi td{background:var(--amberTint)}
.xl-grid tr.picked td{background:var(--greenTint);box-shadow:inset 0 0 0 1px var(--green2)}
.xl-grid td[data-a="rowpick"]{cursor:pointer}
.xl-grid td[data-a="rowpick"]:hover{background:var(--greenTint)}
.xl-tabs{display:flex;background:var(--sheetHead);border-top:1px solid var(--line)}
.xl-tab{border:0;background:transparent;padding:9px 18px;font:500 13px 'IBM Plex Sans',sans-serif;color:var(--ink2);cursor:pointer;border-top:2px solid transparent;margin-top:-1px}
.xl-tab.on{background:var(--surface);color:var(--green);border-top-color:var(--green);font-weight:600}
.flagcell{animation:flag 2.2s ease-in-out infinite}

/* ---------- mission chrome ---------- */
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--green);background:var(--greenTint);border-radius:6px;padding:3px 10px;margin-bottom:8px}
.mh h1{font-size:clamp(1.5rem,4.2vw,2.1rem);line-height:1.15;letter-spacing:-.015em}
.obj{color:var(--ink2);font-size:14px;margin-top:6px;max-width:62ch}
.stepper{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.stepper i{width:26px;height:6px;border-radius:3px;background:var(--line);transition:background .4s}
.stepper i.d{background:var(--green)}.stepper i.c{background:var(--green2);animation:pulse 1.6s ease-in-out infinite}
.stepper span{margin-left:6px;font-weight:500}
details.story{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--navy2);border-radius:10px;padding:10px 16px;margin-bottom:12px}
details.story summary{cursor:pointer;font-weight:600;font-size:14px}
details.story p{margin-top:8px;color:var(--ink2);font-size:15px;font-style:italic}
.todo{display:flex;gap:12px;align-items:flex-start;background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.todo svg{flex:none;margin-top:3px;color:var(--green2)}
.memo{background:var(--amberTint);border:1px solid var(--amberLine);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink)}
.memo b{color:var(--amber)}
.qmeta{font-size:13px;color:var(--green);font-weight:600;margin-bottom:6px}
.qp{font-size:1.2rem;line-height:1.3;margin-bottom:14px;font-weight:600}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--green2);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--green);background:var(--greenTint)}
.opt.right{border-color:var(--green);background:var(--greenTint)}
.opt.wrong{border-color:var(--amberLine);background:var(--amberTint)}
.opt.shake{animation:shake .35s}
.ltr{flex:none;width:26px;height:26px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:600 12px 'IBM Plex Mono',monospace;margin-top:1px}
.opt.right .ltr{background:var(--green);color:var(--onGreen);border-color:var(--green)}
.opt.sel .ltr{background:var(--green2);color:#06210F;border-color:var(--green2)}
.fb{margin-top:14px;border-radius:12px;padding:14px 16px;animation:pop .35s ease both}
.fb.ok{background:var(--greenTint);border:1px solid var(--green)}
.fb.warn{background:var(--amberTint);border:1px solid var(--amberLine)}
.fbt{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.fb.ok .fbt{color:var(--green)}.fb.warn .fbt{color:var(--amber)}
.fb p{font-size:15px}
.xp{display:inline-block;margin-top:8px;background:var(--green);color:var(--onGreen);font:700 13px 'IBM Plex Mono',monospace;padding:3px 10px;border-radius:999px}
.finput{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);overflow:hidden}
.finput:focus-within{border-color:var(--green2)}
.finput span{padding:0 12px;color:var(--green);font:italic 600 14px 'IBM Plex Mono',monospace}
.finput input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px 'IBM Plex Mono',monospace;padding:14px 12px 14px 0;outline:0}
.finput input:disabled{opacity:.7}
.lab{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);color:var(--ink);font:400 15px/1.5 'IBM Plex Sans',sans-serif;resize:vertical}
textarea:focus{outline:0;border-color:var(--green2)}
.code{font:500 14px/1.6 'IBM Plex Mono',monospace;background:var(--navy);color:#E8EEF5;border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:nowrap}
.code .k{color:#7FE3B0}.code .s{color:#FFD479}.code .bad{background:rgba(255,120,110,.25);border-radius:4px;padding:0 3px}
.anat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px;font-size:12.5px;color:var(--ink2)}
.anat span{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.tokens{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 15px 'IBM Plex Mono',monospace;margin:6px 0 4px}
.tok{border:1.5px dashed var(--line);background:var(--surface2);color:var(--ink);font:inherit;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:44px}
.tok.sel{border-style:solid;border-color:var(--amberLine);background:var(--amberTint)}
.tokens .p{color:var(--ink2)}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fig small{display:block;font-size:12px;color:var(--ink2)}.fig b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.fig.bad b{color:var(--red)}.fig.good b{color:var(--green)}
@media (max-width:420px){.figs{grid-template-columns:1fr}}
.chat{display:grid;gap:10px}
.chat h3{font-size:14px;display:flex;align-items:center;gap:8px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:pop .35s ease both}
.msg .avatar{width:34px;height:34px;flex:none}
.msg div{background:var(--surface2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px;font-size:14px}
.msg b{display:block;font-size:12px;color:var(--green)}
.teamtag{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--green);margin-bottom:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.fnchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px 'IBM Plex Mono',monospace;padding:9px 12px;border-radius:8px;cursor:pointer;min-height:42px}
.fnchip:hover:not(:disabled){border-color:var(--green2)}
.fnchip.wrong{border-color:var(--amberLine);background:var(--amberTint)}
.fnchip.right{border-color:var(--green);background:var(--greenTint);color:var(--green)}
.need{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:10px}
.need h3{font-size:15px;font-weight:600}
.need.done{border-color:var(--green);background:var(--greenTint)}
.stack{display:grid;gap:12px}
.pts{font:600 12px 'IBM Plex Mono',monospace;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);padding:2px 8px;border-radius:999px;white-space:nowrap}

/* ---------- progress, levels ---------- */
.pbar{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:999px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.route{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.route li{position:relative;text-align:center;padding:0 4px;font-size:12px;color:var(--ink2)}
.route li+li::before{content:'';position:absolute;top:19px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}
.route li.past::before,.route li.now::before{background:var(--green2)}
.route .rn{position:relative;z-index:1;display:grid;place-items:center;width:40px;height:40px;margin:0 auto 6px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font:600 14px 'IBM Plex Mono',monospace;color:var(--ink2)}
.route li.past .rn{background:var(--green);border-color:var(--green);color:var(--onGreen)}
.route li.now .rn{border-color:var(--green2);color:var(--green);box-shadow:0 0 0 5px var(--greenTint);animation:pulse 2s infinite}
.route .rl{display:block;font-weight:600;color:var(--ink);line-height:1.25}
.route small{color:var(--ink2)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media (max-width:620px){.sgrid{grid-template-columns:repeat(2,1fr)}.route .rl{font-size:11px}}
.sbox{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sbox small{display:block;font-size:12px;color:var(--ink2)}.sbox b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.id{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;border-top:6px solid var(--green)}
.id .avatar{width:104px;height:104px}
.idco{font-size:13px;color:var(--ink2)}
.id h2{font-size:1.5rem;letter-spacing:-.01em}
.role{font-weight:700;letter-spacing:.06em;color:var(--green);font-size:13px;margin-top:2px}
@media (max-width:520px){.id{grid-template-columns:1fr;text-align:center;justify-items:center}}
.nm{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);color:var(--ink);font:500 16px 'IBM Plex Sans',sans-serif}
.nm:focus{outline:0;border-color:var(--green2)}

/* ---------- briefing ---------- */
.brief{display:grid;gap:14px}
.issues{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width:700px){.issues{grid-template-columns:1fr}}
.issue{border-left:4px solid var(--amberLine);background:var(--amberTint);border-radius:8px;padding:10px 12px;font-size:14px}
.issue b{display:block;color:var(--amber)}
.plan{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.plan li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:14.5px}
.plan li b{display:block}.plan .pn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 13px 'IBM Plex Mono',monospace}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width:700px){.legend{grid-template-columns:1fr}}
.lg-i{border-radius:10px;padding:10px 12px;font-size:13.5px}
.lg-i b{display:block;margin-bottom:2px}
.lg-ok{background:var(--greenTint);border:1px solid var(--green)}.lg-ok b{color:var(--green)}
.lg-w{background:var(--amberTint);border:1px solid var(--amberLine)}.lg-w b{color:var(--amber)}
.lg-t{background:var(--navy);color:#fff}.lg-t b{color:#7FE3B0}

/* ---------- map ---------- */
.mapsum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.mapsum .avatar{width:64px;height:64px}
.path{list-style:none;margin:18px 0 0;padding:0;position:relative}
.node{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;padding-bottom:16px}
.node::before{content:'';position:absolute;left:21px;top:44px;bottom:-4px;width:3px;background:var(--line)}
.node:last-child::before{display:none}
.node.done::before{background:var(--green2)}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:var(--ink2);font:600 15px 'IBM Plex Mono',monospace;position:relative;z-index:1}
.node.done .dot{background:var(--green);border-color:var(--green);color:var(--onGreen)}
.node.open .dot{border-color:var(--green2);color:var(--green);box-shadow:0 0 0 6px var(--greenTint);animation:pulse 2s infinite}
.node.locked .dot{background:var(--surface2)}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.node.open .ncard{border-color:var(--green2);box-shadow:var(--shadow)}
.node.locked .ncard{opacity:.72;background:var(--surface2)}
.ncard h3{font-size:1.02rem}.ncard p{font-size:14px;color:var(--ink2);margin:2px 0 8px}
.meta{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.state{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.state.done{background:var(--greenTint);color:var(--green)}.state.open{background:var(--amberTint);color:var(--amber)}.state.locked{background:var(--sheetHead);color:var(--ink2)}

/* ---------- reward / results ---------- */
.reward{text-align:center;padding:28px 20px;border-top:6px solid var(--green)}
.trophy{font-size:56px;line-height:1;animation:pop .6s ease both}
.reward h1{font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.02em;margin-top:6px}
.rsub{color:var(--ink2);margin-top:4px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0;text-align:center}
@media (max-width:700px){.rgrid{grid-template-columns:1fr}}
.rbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 12px;display:grid;gap:6px;justify-items:center;align-content:start}
.rbox small{font-size:12px;color:var(--ink2);font-weight:600}
.rbox .big{font-size:2rem;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
.unlock{position:relative;width:86px;height:86px;display:grid;place-items:center}
.unlock .lockic{position:absolute;font-size:34px;animation:fadeout .6s .3s ease forwards}
.unlock .medal{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#7FE3B0,var(--green) 70%);display:grid;place-items:center;font-size:38px;box-shadow:0 6px 18px rgba(29,111,66,.4);animation:medal .8s .7s cubic-bezier(.2,1.4,.4,1) both}
.unlock .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--green2);opacity:0;animation:ring 1s 1.2s ease-out}
.brk{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;text-align:left}
.brk td{padding:6px 4px;border-bottom:1px solid var(--line)}.brk td:last-child{text-align:right;font:600 13px 'IBM Plex Mono',monospace;color:var(--green)}
.learned{text-align:left;margin:18px 0 0}
.learned h3{font-size:14px;margin-bottom:6px}
.learned ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14.5px}
.stamp{display:inline-block;border:3px solid var(--green);color:var(--green);font-weight:700;letter-spacing:.14em;padding:6px 16px;border-radius:8px;transform:rotate(-4deg);margin:14px 0 4px;animation:stamp .6s .3s cubic-bezier(.2,1.6,.4,1) both}
.rub{width:100%;border-collapse:collapse;font-size:14px}
.rub th{text-align:left;font-size:12px;color:var(--ink2);font-weight:600;padding:8px 6px;border-bottom:2px solid var(--line)}
.rub td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rub td:last-child,.rub th:last-child{text-align:right;white-space:nowrap}
.rub .pbar{height:7px;margin-top:6px}
.rub .tot td{font-weight:700;border-bottom:0;font-size:15px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:16px 0}
.ring2{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--green2) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring2 div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:1.7rem;line-height:1}
.ring2 small{display:block;font-size:11px;color:var(--ink2);font-weight:500;text-align:center}
.lvlbadge{display:inline-block;background:var(--green);color:var(--onGreen);font-weight:700;padding:4px 14px;border-radius:999px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:560px){.bgrid{grid-template-columns:1fr}}
.bcard{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bcard .medal2{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 30% 25%,#7FE3B0,var(--green) 70%)}
.bcard.off{background:var(--surface2)}
.bcard.off .medal2{background:var(--sheetHead);filter:grayscale(1);opacity:.55}
.bcard b{display:block}.bcard small{color:var(--ink2);font-size:13px;display:block}
.can{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.can li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.can svg{flex:none;color:var(--green);margin-top:3px}

/* ---------- overlays ---------- */
#toasts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:50;display:grid;gap:8px;justify-items:center;pointer-events:none}
.tst{background:var(--navy);color:#fff;font:700 15px 'IBM Plex Mono',monospace;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toast 1.9s ease both;border:1px solid var(--green2)}
.tst.lvl{font-family:'IBM Plex Sans',sans-serif;background:var(--green);color:var(--onGreen);border-color:transparent}
.mbg{position:fixed;inset:0;background:rgba(8,16,27,.62);display:grid;place-items:center;padding:16px;z-index:60;animation:enter .2s ease}
.modal{max-width:420px;width:100%}
#cf{position:fixed;inset:0;pointer-events:none;z-index:55}

/* ---------- animations ---------- */
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14);background:var(--green2);color:#06210F}100%{transform:scale(1)}}
@keyframes toast{0%{opacity:0;transform:translateY(14px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
@keyframes flag{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 2px var(--red)}}
@keyframes fadeout{to{opacity:0;transform:scale(.6) rotate(-15deg)}}
@keyframes medal{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes stamp{from{opacity:0;transform:rotate(-4deg) scale(2.2)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header id="top" class="top">
  <div class="top-in">
    <button class="brand" data-a="home" aria-label="Ir al mapa de misiones">
      <span class="lg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg></span>
      <span><span class="b1">MISIÓN </span>EXCEL</span>
    </button>
    <div class="stats" aria-label="Estado del jugador">
      <div class="stat"><small>Nivel</small><b id="s-lvl">1</b></div>
      <div class="stat" id="s-xpw"><small>XP</small><b id="s-xp">0</b></div>
      <div class="stat"><small>Insignias</small><b id="s-bd">🏅 0</b></div>
      <button class="ic-btn" data-a="askreset" aria-label="Reiniciar la experiencia" title="Reiniciar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
  </div>
  <div class="top-bar"><i id="s-bar"></i></div>
</header>
<main id="main"></main>
<div id="toasts" aria-live="polite"></div>
<div id="modal"></div>
<canvas id="cf" aria-hidden="true"></canvas>

<script>
(()=>{
'use strict';

/* =====================================================================
   DATOS DEL JUEGO
   ===================================================================== */
const KEY='mision-excel-global-v1';
const LEVELS=[
  {n:1,name:'Explorador de datos',at:0},
  {n:2,name:'Analista en formación',at:10},
  {n:3,name:'Solucionador financiero',at:40},
  {n:4,name:'Analista experto',at:100}
];
const BADGES={
  m1:{icon:'🏅',name:'Detective de datos',skill:'Reconoce el problema y selecciona la información necesaria.'},
  m2:{icon:'🏅',name:'Cazador de errores',skill:'Selecciona, construye y revisa funciones de Excel.'},
  m3:{icon:'🏅',name:'Equipo de rescate financiero',skill:'Analiza, verifica y corrige resultados de forma colaborativa.'},
  final:{icon:'🏅',name:'Analista experto',skill:'Integra análisis, fórmulas, verificación y explicación.'}
};
const DS1=[['Cuaderno','Papelería',120000],['Bolígrafo','Papelería',80000],['Monitor','Tecnología',450000],['Carpeta','Papelería',60000]];
const DS3=DS1.concat([['Teclado','Tecnología',150000],['Mouse','Tecnología',70000]]);
const DSF=DS3.concat([['Resaltador','Papelería',40000],['Impresora','Tecnología',330000]]);
const COLS=[
  {L:'A',info:'Texto · Producto: nombre de cada artículo vendido. Identifica el registro.'},
  {L:'B',info:'Texto · Categoría: agrupa los productos (Papelería o Tecnología). Sirve como criterio.'},
  {L:'C',info:'Número · Ventas: valor vendido en pesos. Es lo que se puede sumar o promediar.'}
];
const HDR=['Producto','Categoría','Ventas'];
const dsRows=ds=>ds.map(r=>[r[0],r[1],{v:r[2]}]);

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{const neg=n<0;const s=Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'−$':'$')+s};
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const IC={
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
function avatar(o={}){
  const s=o.skin||'#E8B994',h=o.hair||'#1E2A38',j=o.jacket||'#1D6F42',bg=o.bg||'#173559';
  return `<svg class="avatar" viewBox="0 0 120 120" aria-hidden="true"><defs><clipPath id="ac"><circle cx="60" cy="60" r="60"/></clipPath></defs><g clip-path="url(#ac)"><rect width="120" height="120" fill="${bg}"/><path d="M12 124c2-28 20-46 48-46s46 18 48 46Z" fill="${j}"/><path d="M50 78h20l-10 17Z" fill="#fff"/><rect x="52" y="62" width="16" height="18" rx="6" fill="${s}"/><ellipse cx="60" cy="48" rx="19" ry="21" fill="${s}"/><path d="M40 47c-2-17 9-27 21-27 13 0 22 10 19 27-3-8-8-12-14-13-8 4-18 4-26 13Z" fill="${h}"/><g fill="none" stroke="#fff" stroke-width="2.2"><rect x="46" y="44" width="12" height="9" rx="3"/><rect x="62" y="44" width="12" height="9" rx="3"/><path d="M58 48h4"/></g></g></svg>`;
}
const AV={me:{},ana:{skin:'#C98F68',hair:'#3B2418',jacket:'#173559',bg:'#1D6F42'},luis:{skin:'#F0C7A4',hair:'#7A5B3A',jacket:'#4B5B6C',bg:'#0F2540'}};

/* =====================================================================
   ESTADO
   ===================================================================== */
const fresh=()=>({started:false,name:'',screen:'welcome',xp:0,awarded:{},badges:[],done:{m1:false,m2:false,m3:false,final:false},step:{m1:0,m2:0,m3:0,final:0},pts:{},att:{},hints:{},formulas:{},expl:''});
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(fresh(),o)}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let U={}; // estado transitorio de la pantalla actual
const levelOf=xp=>LEVELS.reduce((a,l)=>xp>=l.at?l:a,LEVELS[0]);
const doneCount=()=>['m1','m2','m3','final'].filter(k=>S.done[k]).length;
const hintsUsed=()=>Object.keys(S.hints).filter(k=>S.hints[k]).length;
const sc=(max,att)=>Math.round(max*[1,.7,.4][Math.min(Math.max(att,1),3)-1]);

function allowed(s){
  if(s==='m2'||s==='r1')return S.done.m1||s==='r1'&&S.done.m1;
  if(s==='r2')return S.done.m2;
  if(s==='m3')return S.done.m2;
  if(s==='r3')return S.done.m3;
  if(s==='final')return S.done.m1&&S.done.m2&&S.done.m3;
  if(s==='results'||s==='badges')return S.done.final;
  if(s==='profile'||s==='briefing'||s==='map'||s==='m1')return S.started;
  return true;
}

/* =====================================================================
   PUNTOS, TOASTS, EFECTOS
   ===================================================================== */
function updateTop(bump){
  const L=levelOf(S.xp);
  $('#s-lvl').textContent=L.n;$('#s-xp').textContent=S.xp;$('#s-bd').textContent='🏅 '+S.badges.length;
  $('#s-bar').style.width=Math.min(100,S.xp)+'%';
  if(bump){const w=$('#s-xpw');w.classList.remove('bump');void w.offsetWidth;w.classList.add('bump')}
}
function toast(txt,cls){const d=document.createElement('div');d.className='tst '+(cls||'');d.textContent=txt;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2000)}
function award(key,n){
  if(S.awarded[key])return false;
  const before=levelOf(S.xp).n;S.awarded[key]=1;S.xp+=n;const after=levelOf(S.xp).n;save();updateTop(true);toast('+'+n+' XP');
  if(after>before)setTimeout(()=>toast('Nivel '+after+': '+LEVELS[after-1].name,'lvl'),1000);
  return true;
}
function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#cf');if(!c||!c.getContext)return;const x=c.getContext('2d');if(!x)return;
  c.width=innerWidth;c.height=innerHeight;
  const cols=['#21A366','#1D6F42','#0F2540','#FFFFFF','#9FB0C3','#7FE3B0'];
  const P=Array.from({length:130},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;
  (function tick(){f++;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(f<170)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
function after(sel){requestAnimationFrame(()=>{const e=$(sel);if(e)e.scrollIntoView({block:'nearest',behavior:'smooth'})})}

/* =====================================================================
   MOTOR DE FÓRMULAS (simula Excel)
   ===================================================================== */
const colIdx=L=>L.charCodeAt(0)-65;
function parseRef(t){
  const m=/^\$?([A-Za-z])\$?(\d+)(?::\$?([A-Za-z])\$?(\d+))?$/.exec(String(t).trim());if(!m)return null;
  const c1=m[1].toUpperCase(),r1=+m[2],c2=(m[3]||m[1]).toUpperCase(),r2=+(m[4]||m[2]);
  return {c1,r1,c2,r2};
}
function splitArgs(s){
  const out=[];let cur='',q=false,d=0;
  for(const ch of s){
    if(ch==='"'){q=!q;cur+=ch}
    else if(!q&&ch==='('){d++;cur+=ch}
    else if(!q&&ch===')'){d--;cur+=ch}
    else if(!q&&d===0&&(ch===','||ch===';')){out.push(cur.trim());cur=''}
    else cur+=ch;
  }
  out.push(cur.trim());return out;
}
const ALIAS={SUMIF:'SUMAR.SI',COUNTIF:'CONTAR.SI',AVERAGE:'PROMEDIO',SUM:'SUMA',COUNT:'CONTAR'};
const KNOWN=['SUMA','SUMAR.SI','CONTAR','CONTAR.SI','PROMEDIO','MAX','MIN'];
function rangeVals(ds,R){const v=[];for(let r=R.r1;r<=R.r2;r++)for(let c=colIdx(R.c1);c<=colIdx(R.c2);c++){const row=ds[r-2];v.push(row?row[c]:null)}return v}
function resize(R2,R1){return {c1:R2.c1,r1:R2.r1,c2:String.fromCharCode(R2.c1.charCodeAt(0)+colIdx(R1.c2)-colIdx(R1.c1)),r2:R2.r1+(R1.r2-R1.r1)}}
function parseCrit(a){
  if(/^".*"$/.test(a))return a.slice(1,-1);
  if(/^-?\d+(\.\d+)?$/.test(a))return parseFloat(a);
  return null;
}
function matches(v,crit){
  if(typeof crit==='number')return v===crit;
  const m=/^(>=|<=|<>|>|<|=)?(.*)$/.exec(crit);const op=m[1]||'=',t=m[2].trim();
  if(/^-?\d+(\.\d+)?$/.test(t)){const n=parseFloat(t),x=typeof v==='number'?v:NaN;
    return op==='>'?x>n:op==='<'?x<n:op==='>='?x>=n:op==='<='?x<=n:op==='<>'?x!==n:x===n}
  const eq=String(v==null?'':v).toLowerCase()===t.toLowerCase();return op==='<>'?!eq:eq;
}
function evalF(raw,ds){
  const s=String(raw||'').replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
  if(!s)return{err:'vacio'};
  if(s[0]!=='=')return{err:'sinigual'};
  const m=/^=\s*([A-Za-z][A-Za-z.]*)\s*\((.*)\)\s*$/.exec(s);
  if(!m)return{err:'sintaxis'};
  let fn=m[1].toUpperCase();fn=ALIAS[fn]||fn;
  if(!KNOWN.includes(fn))return{err:'nombre',fn:m[1].toUpperCase()};
  const a=splitArgs(m[2]);
  const R1=parseRef(a[0]);if(!R1)return{err:'rango'};
  const vals=rangeVals(ds,R1),nums=vals.filter(v=>typeof v==='number');
  let value,rng=[R1],crit;
  if(fn==='SUMA')value=nums.reduce((p,c)=>p+c,0);
  else if(fn==='PROMEDIO')value=nums.length?nums.reduce((p,c)=>p+c,0)/nums.length:0;
  else if(fn==='CONTAR')value=nums.length;
  else if(fn==='MAX')value=nums.length?Math.max(...nums):0;
  else if(fn==='MIN')value=nums.length?Math.min(...nums):0;
  else{
    if(a.length<2||a[1]==='')return{err:'args'};
    crit=parseCrit(a[1]);if(crit===null)return{err:'critname'};
    if(fn==='CONTAR.SI')value=vals.filter(v=>matches(v,crit)).length;
    else{
      let R2=R1,R2o=null;
      if(a[2]!==undefined&&a[2]!==''){R2o=parseRef(a[2]);if(!R2o)return{err:'rango'};R2=resize(R2o,R1)}
      const sv=rangeVals(ds,R2);let t=0;vals.forEach((v,i)=>{if(matches(v,crit)){const q=sv[i];if(typeof q==='number')t+=q}});
      value=t;if(R2o)rng.push(R2o);
    }
  }
  return {fn,rng,crit,value};
}
const ERRS={
  vacio:()=>'Escribe una fórmula para poder verificarla.',
  sinigual:()=>'Toda fórmula en Excel empieza con el signo =. Agrégalo al inicio.',
  sintaxis:()=>'No se reconoce la estructura. Debe verse como =FUNCIÓN(argumentos); revisa que los paréntesis y las comillas estén cerrados.',
  nombre:r=>`Excel devolvería #¿NOMBRE?: «${r.fn}» no es una función que este ejercicio reconozca. Revisa cómo se escribe.`,
  rango:()=>'Uno de los rangos no es válido. Usa el formato B2:B9 (columna y fila inicial, dos puntos, columna y fila final).',
  critname:()=>'El criterio de texto debe ir entre comillas, por ejemplo "Papelería". Sin comillas, Excel devuelve #¿NOMBRE?.',
  args:()=>'Faltan argumentos. Esta función necesita, además del rango, un criterio entre comillas.'
};
function checkF(raw,ds,x){
  const r=evalF(raw,ds);const bad=m=>({ok:false,msg:m});
  if(r.err)return bad(ERRS[r.err](r));
  if(r.fn!==x.fn)return bad(`Esa fórmula usa ${r.fn}. ${x.whyFn}`);
  if(x.critC){
    const c=r.rng[0];
    if(c.c1!==x.critC||c.c2!==x.critC)return bad(`El rango de criterio debe ser la columna Categoría (${x.critC}), porque ahí es donde Excel busca el texto. Revisa la primera referencia.`);
    if(c.r1!==2||c.r2!==x.last)return bad(`El rango de criterio debe abarcar todas las filas de datos: de ${x.critC}2 a ${x.critC}${x.last}. Revisa dónde empieza y dónde termina.`);
    if(String(r.crit).toLowerCase()!==x.critv.toLowerCase())
      return bad(norm(r.crit)===norm(x.critv)?`Cuidado con la tilde: el criterio debe escribirse exactamente como aparece en la tabla, "${x.critv}".`:`El criterio debe coincidir con el texto de la tabla: "${x.critv}".`);
    if(x.sumC){
      const q=r.rng[1];
      if(!q)return bad('Falta el rango de suma: indica qué columna debe sumar Excel cuando se cumpla el criterio.');
      if(q.c1!==x.sumC||q.c2!==x.sumC)return bad(`El rango de suma debe ser la columna Ventas (${x.sumC}), que contiene los valores que Excel debe sumar.`);
      if(q.r1!==2||q.r2!==x.last)return bad(`El rango de suma debe tener las mismas filas que el de criterio: ${x.sumC}2:${x.sumC}${x.last}.`);
    }
  }else if(x.rangeC){
    const c=r.rng[0];
    if(c.c1!==x.rangeC||c.c2!==x.rangeC)return bad(`El rango debe ser la columna Ventas (${x.rangeC}), que contiene los valores numéricos.`);
    if(c.r1!==2||c.r2!==x.last)return bad(`El rango debe abarcar todas las filas de datos: ${x.rangeC}2:${x.rangeC}${x.last}. Ahora omite o agrega filas.`);
  }
  if(r.value!==x.value)return bad('El resultado no coincide con el esperado. Revisa cada argumento de la fórmula.');
  return {ok:true,value:r.value,msg:`La fórmula está bien construida. Excel devuelve ${x.plain?r.value:fmt(r.value)}, que coincide con el resultado esperado.`};
}

function sheet(o){

      const c=(cell&&typeof cell==='object')?cell:{v:cell};
      const disp=c.t!==undefined?c.t:(typeof c.v==='number'?fmt(c.v):(c.v==null?'':c.v));
      const isN=c.n||typeof c.v==='number';
      const cls=[isH?'h':'',isN&&!isH?'n':'',c.cls||'',c.wrap?'wrapc':'',c.mono?'mono':''].filter(Boolean).join(' ');
      const act=o.rowPick&&!isH&&rn>=2&&rn<=o.rowPick?'rowpick':'cell';

}

    {n:'Comprende la situación y selecciona las funciones apropiadas',max:20,pts:c1,note:'Elección de función para cada indicador.'},
    {n:'Construye las fórmulas correctamente',max:25,pts:c2,note:'Fórmulas validadas por el motor de Excel simulado.'},
    {n:'Verifica y corrige los resultados',max:20,pts:c3,note:'Auditoría de fórmulas ajenas y verificación cruzada.'},
    {n:'Explica las decisiones y el procedimiento',max:20,pts:c4,note:'Funciones, errores y verificación mencionados.'},
    {n:'Trabaja con autonomía y presenta el archivo organizado',max:15,pts:c5,note:`Archivo organizado ${P.c5_org||0}/7 · Autonomía ${auto}/8 (${h} pista${h===1?'':'s'} usada${h===1?'':'s'}).`}
  ];
}
function levelAch(t){
  if(t>=90)return['Sobresaliente','Dominas el proceso completo: seleccionas funciones, construyes fórmulas, verificas y explicas con autonomía.'];
  if(t>=75)return['Logrado','Resuelves el caso con buen criterio. Refuerza los detalles que restaron puntos para llegar a la excelencia.'];
  if(t>=60)return['En desarrollo','Comprendes la lógica del problema, pero necesitas practicar la construcción y verificación de fórmulas.'];
  return['Por reforzar','Vuelve a jugar el reto y usa la retroalimentación para reconstruir el procedimiento paso a paso.'];
}

  cancel(){$('#modal').innerHTML=''},
  closemodal(el,e){if(e.target===el)$('#modal').innerHTML=''},
  doreset(){S=fresh();save();$('#modal').innerHTML='';U={};go('welcome')},
  /* hoja */
  cell(el){const x=el.closest('.xl');$('.xl-name',x).textContent=el.dataset.ref;$('.xl-v',x).textContent=el.dataset.fx;$$('td.cs',x).forEach(t=>t.classList.remove('cs'));el.classList.add('cs')},
  colinfo(el){const x=el.closest('.xl');$('.xl-name',x).textContent='Col '+el.dataset.l;$('.xl-v',x).textContent=el.dataset.info},
  tab(el){U.tab=el.dataset.t;render()},
  rowpick(el){const r=+el.dataset.row;U.rows=U.rows||[];U.rows=U.rows.includes(r)?U.rows.filter(x=>x!==r):U.rows.concat(r);U.msg=null;render()},
  /* quiz */
  pick(el){const q=curQuiz();if(!q||U.ok)return;const i=+el.dataset.i;U.tried=(U.tried||[]).concat(i);if(q.opts[i].ok){U.ok=true;award(q.key,q.xp)}render();after('.fb')},
  adv(el){
    const m=el.dataset.m;const last={m1:2,m2:3,m3:4,final:5}[m];
    if(m==='final'){if(S.step.final>=5)finishMission('final');else stepTo('final',S.step.final+1);return}
    if(S.step[m]>=last)finishMission(m);else stepTo(m,S.step[m]+1);
  },
  /* fórmulas M2 / M3 */
  fill(){const i=$('#fi');if(!i)return;const f=S.screen==='m2'?WRONG2:WRONG3;i.value=f;U.txt=Object.assign({},U.txt,{f});i.focus()},
  verify(){
    const i=$('#fi');const v=i?i.value:'';const m2=S.screen==='m2';
    const r=checkF(v,m2?DS1:DS3,m2?EXP.m2:EXP.m3);
    U.txt=Object.assign({},U.txt,{f:v});U.msg=r;
    if(r.ok){U.ok=true;S.formulas[m2?'m2':'m3']=v.replace(/[“”]/g,'"').trim();award(m2?'m2_fix':'m3_fix',5)}
    render();after('.fb');
  },
  /* selección múltiple y radios */
  tog(el){
    const i=+el.dataset.i;U.sel=U.sel||[];U.sel=U.sel.includes(i)?U.sel.filter(x=>x!==i):U.sel.concat(i);U.res=null;
    el.classList.toggle('sel',U.sel.includes(i));el.setAttribute('aria-pressed',U.sel.includes(i));
    const l=$('.ltr',el);if(l&&!el.classList.contains('tok'))l.textContent=U.sel.includes(i)?'✓':'·';
    const f=el.closest('.card');const fb=f&&$('.fb',f);if(fb)fb.remove();
  },
  chk(){
    const sel=U.sel||[];const sc_=S.screen,st=S.step[sc_];
    const good=(sc_==='m2')?[0,1,2,3]:(sc_==='m3')?[0,2]:[0,1,2,3];
    const g=sel.filter(i=>good.includes(i)).length,w=sel.filter(i=>!good.includes(i)).length,miss=good.length-g;
    const ok=w===0&&miss===0;U.res={ok,g,w,miss};
    if(ok){
      if(sc_==='m2')award('m2_expl',10);
      else if(sc_==='m3')award('m3_rev',2);
      else{S.att.c5=(S.att.c5||0)+1;if(S.pts.c5_org==null)S.pts.c5_org=S.att.c5===1?7:4;award('f5',6)}
    }else if(sc_==='final'){S.att.c5=(S.att.c5||0)+1;save()}
    save();render();after('.fb');
  },
  rad(el){U.rad=+el.dataset.i;$$('.opt[data-a="rad"]').forEach(b=>b.classList.toggle('sel',b===el))},
  rowok(){
    const rows=U.rows||[];
    if(rows.length===1&&rows[0]===7){U.ok=true;U.msg={ok:true,t:'La fila 7 (Mouse, $70.000) queda fuera de B2:B6 y C2:C6. La diferencia del informe es exactamente ese valor.'};award('m3_row',3)}
    else if(rows.includes(7)){U.msg={ok:false,t:'La fila 7 sí es parte del problema, pero también marcaste filas que la fórmula ya incluye. Deja solo la que queda fuera.'}}
    else if(rows.some(r=>r<2||r>7)){U.msg={ok:false,t:'Selecciona una fila de datos (filas 2 a 7) de la tabla de ventas.'}}
    else U.msg={ok:false,t:'Esas filas sí están dentro de los rangos de la fórmula (filas 2 a 6). Busca el registro de Tecnología que queda por fuera.'};
    render();after('.fb');
  },
  send(){
    const t=((U.txt&&U.txt.m3)||'').trim();
    if(U.rad==null){U.msg={ok:false,t:'Elige primero el argumento que mejor sustenta tu solución.'}}
    else if(!M3ARG[U.rad].ok){U.msg={ok:false,t:M3ARG[U.rad].fb}}
    else if(t.length<25){U.msg={ok:false,t:'El argumento elegido es sólido. Ahora escribe al menos una frase (25 caracteres) con tus palabras para explicárselo al equipo.'}}
    else{U.ok=true;U.msg={ok:true,t:M3ARG[U.rad].fb};award('m3_arg',10)}
    U.txt=Object.assign({},U.txt,{m3:t});render();after('.fb');
  },
  /* reto final */
  fn(el){
    const k=el.dataset.k,f=el.dataset.f,d=F1[k];if(S.pts['c1_'+k]!=null)return;
    S.att['c1_'+k]=(S.att['c1_'+k]||0)+1;U.f1=U.f1||{};
    if(f===d.ok){S.pts['c1_'+k]=sc(d.max,S.att['c1_'+k]);U.f1[k]={ok:true,f};if(['a','b','c'].every(x=>S.pts['c1_'+x]!=null))award('f1',6)}
    else U.f1[k]={ok:false,f};
    save();render();
  },
  hint(el){const k=el.dataset.k;S.hints[k]=true;save();render()},
  fverify(el){
    const k=el.dataset.k,i=$('#fi-'+k),v=i?i.value:'';
    S.att['c2_'+k]=(S.att['c2_'+k]||0)+1;
    const r=checkF(v,DSF,EXP['f_'+k]);U.fm=U.fm||{};U.fm[k]=r;U.txt=Object.assign({},U.txt,{['f'+k]:v});
    if(r.ok){S.formulas['f_'+k]=v.replace(/[“”]/g,'"').trim();S.pts['c2_'+k]=sc(F2[k].max,S.att['c2_'+k]);if(['a','b','c'].every(x=>S.formulas['f_'+x]))award('f2',6)}
    save();render();
  },
  aud(el){
    const k=el.dataset.k,i=+el.dataset.i,a=AUDIT.find(x=>x.k===k);if(S.pts['c3_'+k]!=null)return;
    S.att['c3_'+k]=(S.att['c3_'+k]||0)+1;U.aud=U.aud||{};U.aud[k]=(U.aud[k]||[]).concat(i);
    if(i===a.ok)S.pts['c3_'+k]=sc(4,S.att['c3_'+k]);
    save();checkAudit();render();
  },
  xchk(el){
    const i=+el.dataset.i;if(S.pts.c3_x!=null)return;
    S.att.c3_x=(S.att.c3_x||0)+1;U.aud=U.aud||{};U.aud.x=(U.aud.x||[]).concat(i);
    if(i===0)S.pts.c3_x=sc(8,S.att.c3_x);
    save();checkAudit();render();
  },
  chip(el){const ta=$('#ex');if(!ta)return;const v=ta.value;ta.value=v+(v&&!/\s$/.test(v)?' ':'')+el.dataset.t;U.txt=Object.assign({},U.txt,{ex:ta.value});ta.focus()},
  sendex(){
    const ta=$('#ex'),t=ta?ta.value.trim():'';U.txt=Object.assign({},U.txt,{ex:t});
    if(t.length<60){U.exmsg='Tu explicación es muy corta. Escribe al menos 2 o 3 frases: qué funciones usaste y por qué, qué errores encontraste y cómo verificaste.';U.ex=null;render();after('.fb');return}
    U.exmsg=null;const R=scoreExpl(t);U.ex=R;S.pts.c4=R.pts;S.expl=t;if(R.pts>=13)award('f4',6);save();render();after('.fb');
  }
};
function checkAudit(){if(AUDIT.every(a=>S.pts['c3_'+a.k]!=null)&&S.pts.c3_x!=null)award('f3',6)}
function scoreExpl(t){
  const x=t.toLowerCase();
  const fns=[/sumar\.si|sumif/,/contar\.si|countif/,/promedio|average/].filter(r=>r.test(x)).length;
  const why=/porque|para |ya que|debido|necesit|condici|criterio|categor|solo |únicamente|unicamente/.test(x);
  const g1=fns>=2&&why?7:fns>=1?4:0;
  const g2=/error|erró|inconsisten|omit|rango|columna|fila|equivoc|incorrect|corregí|corregi|correg|falla|fallo/.test(x)?7:0;
  const g3=/verifiqu|comprob|control|coincid|valid|revis|contrast|suma total|1\.?300\.?000/.test(x)?6:0;
  return {g1,g2,g3,pts:g1+g2+g3};
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(fn)fn(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target;if(t&&t.dataset&&t.dataset.u){U.txt=Object.assign({},U.txt);U.txt[t.dataset.u]=t.value}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.classList&&e.target.tagName==='INPUT'&&/^fi/.test(e.target.id)){
    e.preventDefault();
    if(e.target.id==='fi')A.verify();else A.fverify({dataset:{k:e.target.id.slice(3)}});
  }
  if(e.key==='Escape')$('#modal').innerHTML='';
});

/* =====================================================================
   INICIO
   ===================================================================== */
S=load()||fresh();
if(!allowed(S.screen)||!SCREENS[S.screen])S.screen=S.started?'map':'welcome';
render(true);
})();
</script>
